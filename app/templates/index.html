<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet Arayüzü</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        #chat-container { width: 400px; border: 1px solid #ccc; border-radius: 8px; background: white; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #chat-box { height: 300px; overflow-y: scroll; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        #input-container { display: flex; gap: 8px; }
        #message-input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        #send-btn { padding: 10px 15px; background: #5c67f2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .message { margin-bottom: 10px; }
        .user-message { text-align: right; color: blue; }
        .ai-message { text-align: left; color: green; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-box"></div>
    <div id="input-container">
        <input type="text" id="message-input" placeholder="Mesajınızı yazın...">
        <button id="send-btn" onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById("message-input");
        const chatBox = document.getElementById("chat-box");
        const message = input.value.trim();

        if (!message) return;

        chatBox.innerHTML += `<div class="message user-message"><b>Sen:</b> ${message}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch("https://benimki-qr8m.onrender.com/api/sohbet", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            chatBox.innerHTML += `<div class="message ai-message"><b>Bot:</b> ${data.response}</div>`;
        } catch (error) {
            chatBox.innerHTML += `<div class="message ai-message" style="color: red;">Sunucuya bağlanılamadı. Servisin aktif olduğundan emin olun.</div>`;
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
